plugins {
	id 'java'
 	id 'org.springframework.boot' version '4.0.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
	id "com.github.node-gradle.node" version "7.1.0"
}

group = 'com.hhh'
version = '0.0.1-SNAPSHOT'
description = 'Async VolumeCommander'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'commons-io:commons-io:2.20.0'
	compileOnly 'org.projectlombok:lombok'
	//developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def frontendDir = file("${project.projectDir}/../frontend")
def frontendBuildDir = file("${frontendDir}/build")
def targetStaticDir = file("${project.projectDir}/src/main/resources/static")

node {
	download = true
	version = "22.19.0"
	npmVersion = "10.9.3"
	nodeProjectDir = frontendDir
}

tasks.register('buildFrontend', NpmTask) {
	inputs.files(fileTree("${frontendDir}/node_modules"))
	inputs.files(fileTree("${frontendDir}/src"))
	inputs.files(fileTree("${frontendDir}/public"))
	inputs.file("${frontendDir}/package.json")

	outputs.dir(frontendBuildDir)

	dependsOn npmInstall
	args = ['run', 'build']
}

tasks.register('copyFrontend', Copy) {
	from buildFrontend
	into targetStaticDir
}

processResources.dependsOn copyFrontend